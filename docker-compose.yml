services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dima_tech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      # Подменяем settings.json только внутри контейнера — оригинальный
      # файл в репозитории не трогаем. Отличие только в db_url: хост "db"
      # (имя сервиса в этой сети) вместо "localhost".
      - ./src/binary_files/settings.docker.json:/app/src/binary_files/settings.json:ro

volumes:
  pgdata:
