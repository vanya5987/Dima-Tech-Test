version: '3.8'

services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dima_tech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      app_network:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5555:8888"
    dns:
      - 127.0.0.11
    dns_opt:
      - ndots:1
      - single-request
    volumes:
      - ./src/binary_files/settings.json:/app/src/binary_files/settings.json:ro
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata: