version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dima_tech
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dima_tech"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 20s

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/dima_tech
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "5555:8888"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/dima_tech
    volumes:
      - ./src/binary_files/settings.json:/app/src/binary_files/settings.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
